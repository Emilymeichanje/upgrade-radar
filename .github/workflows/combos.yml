name: Refresh combo index
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 11:17 Singapore time
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-combos.py
      - name: Commit if changed, then redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/combos.json && git ls-files --error-unmatch data/combos.json >/dev/null 2>&1; then echo "no change"; exit 0; fi
          git config user.name "combo-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/combos.json
          git commit -m "Refresh two-card combo index from Commander Spellbook"
          git push
          gh workflow run pages.yml --ref main
