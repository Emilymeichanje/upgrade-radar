name: Refresh EDHREC snapshot
on:
  schedule:
    - cron: '41 2 * * 1,4'   # Mon & Thu 10:41 Singapore time
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-snapshot.py
      - name: Commit if changed, then redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/snapshot.json; then echo "no change"; exit 0; fi
          git config user.name "snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "Refresh EDHREC snapshot"
          git push
          gh workflow run pages.yml --ref main
