<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MTG Dashboard</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f1513"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column, sticky header with filters; deck grid → deck detail with tabs. Numbers in mono; every color a token. */
:root{
  --bg:#f2f4f3;--panel:#ffffff;--fg:#17211d;--muted:#5d6b66;--line:#d6ddda;--soft:#e6ebe9;
  --accent:#0f7a6f;--accent-fg:#ffffff;--good:#1c7c3f;--warn:#a2630a;--bad:#b2362f;
  --W:#efe2b0;--U:#8ab8e6;--B:#9b8fae;--R:#e07b5f;--G:#79c07c;--C:#c3c9c6;
  --display:"Fraunces",Georgia,serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513;--panel:#161d1a;--fg:#e8ece9;--muted:#98a6a0;--line:#2a3430;--soft:#1f2824;
  --accent:#34c7b4;--accent-fg:#0b1512;--good:#5fd38a;--warn:#e3a94a;--bad:#f0776d;
  --W:#d9ccA0;--U:#6fa2d6;--B:#8a7ea0;--R:#d9684c;--G:#5fae64;--C:#7e8884;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513;--panel:#161d1a;--fg:#e8ece9;--muted:#98a6a0;--line:#2a3430;--soft:#1f2824;
  --accent:#34c7b4;--accent-fg:#0b1512;--good:#5fd38a;--warn:#e3a94a;--bad:#f0776d;
  --W:#d9cca0;--U:#6fa2d6;--B:#8a7ea0;--R:#d9684c;--G:#5fae64;--C:#7e8884;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.86em}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1080px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
header.top h1{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
header.top h1 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.78rem;margin-left:8px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.ctl label{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input[type=date],input[type=search],select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:16px 48px}
.status{font-size:.85rem;color:var(--muted);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px 16px}
.status b{color:var(--fg);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.deck{display:grid;grid-template-columns:64px 1fr;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;text-align:left;min-width:0;align-items:start}
.deck:hover{border-color:var(--accent)}
.deck img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:var(--soft)}
.deck .ph{width:64px;height:64px;border-radius:6px;background:var(--soft)}
.deck h3{font-size:1rem;font-weight:700}
.deck .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.8rem;color:var(--muted);margin-top:4px}
.pips{display:inline-flex;gap:2px}
.pip{width:11px;height:11px;border-radius:50%;border:1px solid var(--line)}
.pip.W{background:var(--W)}.pip.U{background:var(--U)}.pip.B{background:var(--B)}.pip.R{background:var(--R)}.pip.G{background:var(--G)}.pip.C{background:var(--C)}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--muted)}
.tag.br{background:var(--accent);color:var(--accent-fg)}
.hits{font-family:var(--mono);font-size:.78rem;color:var(--accent)}
.sect{font-family:var(--display);font-size:1.05rem;font-weight:700;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.sect small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.8rem}
/* detail */
.back{background:none;border:0;color:var(--accent);padding:0;cursor:pointer;font-weight:600;margin-bottom:10px}
.hero{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;margin-bottom:14px}
.hero img{width:96px;border-radius:6px;background:var(--soft)}
.hero h2{font-size:1.45rem;font-weight:700}
.hero .meta{color:var(--muted);font-size:.9rem;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:56px 1fr;gap:12px;min-width:0}
.card img{width:56px;border-radius:4px;background:var(--soft)}
.card .ph{width:56px;height:78px;border-radius:4px;background:var(--soft)}
.card .name{font-weight:700;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.card .name a{color:inherit;text-decoration:none}.card .name a:hover{text-decoration:underline}
.card .mana{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.card .type{font-size:.84rem;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:.76rem;margin-top:6px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:600}
.stats .up{color:var(--good)}.stats .dn{color:var(--bad)}
.roles{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.role{font-size:.72rem;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--fg)}
.role.fit{border-color:var(--accent);color:var(--accent)}
.use{margin-top:8px;font-size:.92rem;border-left:3px solid var(--accent);padding-left:10px}
.use .swap{color:var(--muted);font-size:.86rem;margin-top:3px}
.oracle{font-size:.84rem;color:var(--muted);margin-top:6px;white-space:pre-wrap;display:none}
.card.open .oracle{display:block}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:.82rem;cursor:pointer}
.acts button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.score{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.empty{color:var(--muted);padding:20px 0;font-size:.95rem}
textarea{width:100%;min-height:220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:.82rem;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.note{font-size:.85rem;color:var(--muted)}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.search{flex-basis:100%;display:flex;gap:10px;align-items:center}
.search input{flex:1;min-width:0;padding:8px 12px;font-size:1rem}
.search select{padding:7px 8px}
.deck .upd{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.panel{flex-basis:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px}
.panel h3{font-size:1rem}
.panel .f{display:grid;gap:4px}
.panel input,.panel select{width:100%;padding:7px 9px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.panel .warn{color:var(--warn);font-size:.86rem}
.panel .err{color:var(--bad);font-size:.86rem}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.84rem;cursor:pointer}
.deck.retired{opacity:.6}
.retire{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.84rem;cursor:pointer;margin-left:auto}
.confirm{background:var(--panel);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;margin:10px 0;display:grid;gap:8px}
.topnav{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.topnav button{border:0;background:none;padding:5px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}
.topnav button[aria-current=page]{background:var(--accent);color:var(--accent-fg)}
body.playing .ctl,body.playing .search,body.playing #count{display:none}
body.playing main .wrap,body.playing header.top .wrap{max-width:1680px}
/* playtest */
.pt-setup{display:grid;gap:14px;max-width:720px}
.seat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
.seat h3{font-size:1rem}
.seat .row select{flex:1;min-width:160px}
.table{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px;min-width:0}
.pl.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pl.dead{opacity:.45}
.pl h3{font-size:1rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pl .life{font-family:var(--mono);font-size:1.3rem;font-weight:600}
.pl .life.low{color:var(--bad)}
.pl .zone{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.perms{display:flex;flex-wrap:wrap;gap:4px}
.perm{font-size:.76rem;padding:2px 7px;border-radius:4px;border:1px solid var(--line);background:var(--bg);white-space:nowrap;cursor:default}
.perm.tapped{opacity:.5;text-decoration:line-through}
.perm.sick{border-style:dashed}
.perm.cmdr{border-color:var(--accent)}
.perm.land{color:var(--muted)}
.perm.target:hover{border-color:var(--bad);cursor:pointer}
.perm.sel{background:var(--accent);color:var(--accent-fg)}
.hand{display:flex;flex-wrap:wrap;gap:6px}
.hc{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:.84rem;cursor:pointer;display:grid;gap:2px;min-width:120px;max-width:200px}
.hc:hover{border-color:var(--accent)}
.hc.cant{opacity:.45;cursor:not-allowed}
.hc .m{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.hc .rl{font-size:.7rem;color:var(--accent)}
.ctlbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);z-index:5;background:var(--bg);padding:8px 0}
.ctlbar .chip.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gamelog{font-family:var(--mono);font-size:.76rem;color:var(--muted);max-height:220px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.gamelog b{color:var(--fg)}
.prompt{background:var(--panel);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;margin:8px 0}
.threat{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
@media (max-width:480px){.deck{grid-template-columns:52px 1fr}.deck img,.deck .ph{width:52px;height:52px}.hero{grid-template-columns:72px 1fr}.hero img{width:72px}}
@media (prefers-reduced-motion:no-preference){.deck,.card{transition:border-color .15s}}
#lstgrid{margin-top:14px;display:grid;gap:14px}
.dg-s h4{margin:0 0 6px;font:700 .95rem var(--display)}.dg-s h4 small{font:400 .8rem var(--body);color:var(--muted)}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.dg-c{position:relative;display:block;aspect-ratio:.716;border-radius:6px;overflow:hidden;background:var(--soft);color:var(--fg);text-decoration:none;font-size:.7rem}
.dg-c img{width:100%;height:100%;object-fit:cover;display:block}
.dg-c span{display:grid;place-items:center;height:100%;padding:4px;text-align:center}
.dg-n{position:absolute;right:4px;bottom:4px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px;font:700 .72rem var(--mono)}
@media (max-width:640px){.dg{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}}
#filtbtn{display:none}
.filters{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem}
.filters .fl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:4px}
.filters .fl:first-child{margin-left:0}
.chip.sm{padding:2px 10px;font-size:.82rem;min-height:0}
.chip.cpip{padding:3px 7px;display:inline-flex;align-items:center}.chip.cpip .pip{width:14px;height:14px}
.chip.cpip[aria-pressed=true]{background:var(--soft);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.filters select{padding:2px 6px;font-size:.82rem}
body.playing .filters{display:none}
.tag.warn{background:none;border:1px solid var(--warn);color:var(--warn)}
.price{font-family:var(--mono);font-size:.78rem;color:var(--fg)}
details.sum{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
details.sum>summary{cursor:pointer;padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;list-style:none}
details.sum>summary::-webkit-details-marker{display:none}
details.sum>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.sum[open]>summary::before{transform:rotate(90deg)}
details.sum>summary b{font-family:var(--mono);font-size:1.05rem}
.sumbody{max-height:340px;overflow:auto;padding:0 12px 12px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.sumbody h4{margin:0 0 4px;font:700 .9rem var(--display)}
.sumbody table{width:100%;border-collapse:collapse;font-size:.84rem}
.sumbody td{padding:2px 0;border-bottom:1px solid var(--soft)}
.sumbody td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dg-p{position:absolute;left:4px;bottom:4px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 4px;font:600 .66rem var(--mono)}
.costbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px;display:grid;gap:6px}
.costbox table{border-collapse:collapse;font-size:.85rem;width:100%}
.costbox td{padding:2px 6px 2px 0;border-bottom:1px solid var(--soft)}
.costbox td.r{text-align:right;font-family:var(--mono)}
.costbox a{color:var(--accent)}
.edit{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}
.edit input,.edit select{padding:6px 8px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.edit .two{display:flex;gap:8px;flex-wrap:wrap}.edit .two input{flex:1;min-width:110px}
.hero .meta select{padding:2px 6px;font-size:.82rem}
/* phones: filters fold away, bigger tap targets, nothing wider than the screen */
@media (max-width:640px){
  header.top .wrap{gap:8px 10px;padding-block:8px}
  header.top h1{font-size:1.05rem;letter-spacing:-.02em}
  header.top h1 small{display:none}
  #filtbtn{display:inline-flex;order:3;flex:none}
  header.top .ctl{display:none;margin-left:0;width:100%;order:4}
  body.ctlopen header.top .ctl{display:flex}
  body.playing #filtbtn,body.playing .search{display:none}
  .filters{order:5;gap:5px}
  .search{gap:6px;flex:1 1 calc(100% - 96px);width:auto;min-width:0;order:2}.search input{width:0}
  .search label.note{display:none}
  .search select{max-width:38%}
  .search .note#cap{display:none}
  .chip{padding:7px 13px;min-height:36px}
  .topnav button{padding:6px 11px}
  #filtbtn{padding:6px 11px}
  .hero{grid-template-columns:72px 1fr;gap:10px}.hero img{width:72px}.hero h2{font-size:1.2rem}
  .card{grid-template-columns:48px 1fr;gap:10px;padding:10px}.card img{width:48px}.card .ph{width:48px;height:67px}
  .tabs{scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}
  .tabs button{padding:10px 12px}
  .seat .row select{min-width:0;width:100%}
  input,select,textarea{font-size:16px} /* stops Android/iOS zooming into inputs */
}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <h1>MTG Dashboard <small id="count"></small></h1>
  <nav class="topnav" aria-label="Sections"><button id="nav-decks" aria-current="page">Decks</button><button id="nav-play">Playtest</button></nav>
  <button class="chip" id="filtbtn" aria-expanded="false" aria-controls="ctlbox">Menu</button>
  <div class="ctl" id="ctlbox">
    <label for="since">New since</label><input type="date" id="since">
    <button class="chip" id="addbtn">+ Add deck</button>
    <button class="chip" id="syncbtn" title="Keep your decks in step across devices with a private GitHub Gist">Sync: off</button>
    <button class="chip" id="checkbtn" title="Check every card in your saved lists against the game engine">Rules check</button>
    <button class="chip" id="bulkbtn" title="Paste several deck exports at once">Bulk lists</button>
    <button class="chip" id="expbtn" title="Download your lists, shortlists and retirements">Export</button>
    <label class="chip" for="impfile">Import</label><input type="file" id="impfile" accept="application/json" hidden>
    <button class="chip" id="theme" title="Switch between light, dark and system theme">Theme: system</button>
  </div>
  <div class="search"><input type="search" id="q" placeholder="Search decks: name, colors (e.g. WUB), bracket, tag" aria-label="Search decks" autocomplete="off"><label class="note" for="sort">Sort</label><select id="sort"><option value="name">Name A–Z</option><option value="updated">Last updated</option><option value="decks">EDHREC popularity</option><option value="price">Cost (high → low)</option><option value="colors">Colours</option></select><span class="note" id="cap"></span></div>
  <div class="filters" id="filters" aria-label="Filter decks"><span class="fl">Bracket</span><button class="chip sm" aria-pressed="true" data-b="2">2</button><button class="chip sm" aria-pressed="true" data-b="3">3</button><button class="chip sm" aria-pressed="true" data-b="4">4</button><button class="chip sm" aria-pressed="true" data-b="cEDH">cEDH</button>
   <span class="fl">Colour</span><button class="chip sm cpip" data-c="W" aria-pressed="false" title="White"><i class="pip W"></i></button><button class="chip sm cpip" data-c="U" aria-pressed="false" title="Blue"><i class="pip U"></i></button><button class="chip sm cpip" data-c="B" aria-pressed="false" title="Black"><i class="pip B"></i></button><button class="chip sm cpip" data-c="R" aria-pressed="false" title="Red"><i class="pip R"></i></button><button class="chip sm cpip" data-c="G" aria-pressed="false" title="Green"><i class="pip G"></i></button><button class="chip sm cpip" data-c="C" aria-pressed="false" title="Colourless"><i class="pip C"></i></button><select id="cmode" aria-label="Colour match"><option value="any">includes</option><option value="exact">exactly</option><option value="within">within</option></select><button class="chip sm" id="fclear" hidden>Clear</button></div>
  <div id="addpanel" class="panel" hidden></div>
  <div id="bulkpanel" class="panel" hidden></div>
  <div id="syncpanel" class="panel" hidden></div>
  <div id="checkpanel" class="panel" hidden></div>
</div></header>

<main><div class="wrap">
  <div class="status" id="status"><span>Loading snapshot…</span></div>
  <div id="home"></div>
  <div id="detail" hidden></div>
  <div id="play" hidden></div>
</div></main>

<script>
(() => {
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(d,p)=>p?Math.round(100*d/p):0;
const fmt=n=>Number(n||0).toLocaleString();
const ciKey=ci=>(ci&&ci.length?[...ci].sort().join(''):'C');
const norm=n=>String(n||'').split(' // ')[0].toLowerCase().replace(/[^a-z0-9]/g,'');

const S={snap:null,index:[],decks:{},db:null,uid:null,since:null,brackets:new Set(['2','3','4','cEDH']),colors:new Set(),cmode:'any',q:'',cur:null,tab:'new',
  live:{},scry:{},cmdr:{},reprints:false};

// ---------- roles (use-case heuristics) ----------
const ROLES=[
 ['Ramp',/add \{|search your library for (up to \w+ )?(a )?basic land|lands? onto the battlefield|land cards? from your library onto the battlefield|treasure token|\bmana\b.*\bcost\b.*\bless\b/i],
 ['Card draw',/draw (a|two|three|x|\d+) cards?|draw cards|look at the top \w+ cards|impulse|exile the top card.*you may play|investigate|clue token/i],
 ['Tutor',/search your library for (a|an|up to) (?!basic land)/i],
 ['Removal',/destroy target|exile target (creature|permanent|nonland|artifact|enchantment)|deals? \w+ damage to (any target|target creature|target player)|fight|bite|-\d\/-\d|sacrifices? a creature/i],
 ['Board wipe',/destroy all|exile all|each creature|all creatures|deals? \w+ damage to each/i],
 ['Counterspell',/counter target/i],
 ['Protection',/hexproof|indestructible|can't be countered|phase out|ward|regenerate|shroud|blink|exile .* return it to the battlefield/i],
 ['Recursion',/return (target|up to \w+ target|all) .* from your graveyard|from your graveyard to (the battlefield|your hand)/i],
 ['Tokens',/create (a|an|two|three|x|\d+) .* tokens?/i],
 ['Go-wide pump',/creatures you control get \+|each creature you control gets \+|anthem/i],
 ['Combat',/extra combat|additional combat|double strike|first strike|trample|menace|haste|attack/i],
 ['Sacrifice outlet',/sacrifice (a|another|an) (creature|permanent|artifact)(?!s? you control, )/i],
 ['Death trigger',/whenever .* (dies|is put into a graveyard)/i],
 ['ETB value',/when .* enters/i],
 ['Lifegain',/gain \w+ life|lifelink/i],
 ['Discard / drain',/each opponent (loses|discards)|opponents? lose/i],
 ['Stax / tax',/can't (cast|activate|attack|untap)|costs? \{\d\} more|spend only|skip/i],
 ['Copy / clone',/copy (target|that|it)|enters as a copy/i],
 ['Counters',/\+1\/\+1 counter|proliferate/i],
 ['Spellslinger',/whenever you cast (an instant|a sorcery|a noncreature|an instant or sorcery)|magecraft|prowess|storm/i],
 ['Artifacts',/artifact/i],
 ['Enchantments',/enchantment/i],
 ['Graveyard',/mill|graveyard/i],
 ['Lands matter',/landfall|land enters/i],
 ['Equipment',/equip/i],
 ['Wincon',/you win the game|loses the game|infinite|each opponent loses \d+ life/i],
];
const TAGMAP={'Tokens':['Tokens','Go-wide pump','Sacrifice outlet'],'Go Wide':['Tokens','Go-wide pump'],'Aristocrats':['Sacrifice outlet','Death trigger','Tokens'],'Sacrifice':['Sacrifice outlet','Death trigger'],'Spellslinger':['Spellslinger','Card draw'],'Artifacts':['Artifacts'],'Enchantress':['Enchantments'],'Enchantments':['Enchantments'],'Lands Matter':['Lands matter','Ramp'],'Landfall':['Lands matter'],'Combo':['Tutor','Wincon','Protection'],'Ramp':['Ramp'],'Big Mana':['Ramp'],'Counterspells':['Counterspell'],'Control':['Counterspell','Removal','Board wipe'],'Stax':['Stax / tax'],'Hatebears':['Stax / tax'],'Voltron':['Equipment','Protection','Combat'],'Equipment':['Equipment'],'Auras':['Enchantments'],'Aggro':['Combat','Go-wide pump'],'+1/+1 Counters':['Counters'],'Proliferate':['Counters'],'Blink':['ETB value','Protection'],'ETB':['ETB value'],'Reanimator':['Recursion','Graveyard'],'Graveyard':['Graveyard','Recursion'],'Self-Mill':['Graveyard','Recursion'],'Lifegain':['Lifegain'],'Clones':['Copy / clone'],'Spell Copy':['Copy / clone'],'Extra Combats':['Combat'],'Ninjas':['Combat'],'Vampires':['Lifegain','Death trigger'],'Legends':['Tutor'],'Historic':['Artifacts'],'Treasure':['Ramp','Tokens'],'Mana Dorks':['Ramp'],'Toolbox':['Tutor'],'Group Slug':['Discard / drain'],'Mill':['Graveyard']};
function rolesOf(txt){const r=[];for(const [n,re] of ROLES){if(re.test(txt||''))r.push(n)}return r.slice(0,5)}
function themeRoles(deck){const set=new Set();for(const t of (deck.tags||[]))for(const r of (TAGMAP[t]||[]))set.add(r);return set}

// ---------- snapshot ----------
async function loadSnapshot(){
  const r=await fetch('data/snapshot.json');S.snap=await r.json();buildIndex();
  $('#status').innerHTML=`<span>EDHREC snapshot <b>${esc(S.snap.date)}</b></span><span>Scryfall: live</span><span id="livest">EDHREC live: checking…</span>`;
}
// try live EDHREC per commander; fall back silently
async function liveEdh(deck){
  if(S.live[deck.slug]!==undefined)return S.live[deck.slug];
  try{const r=await fetch(`https://json.edhrec.com/pages/commanders/${deck.edh||deck.slug}.json`,{mode:'cors'});
    if(!r.ok)throw 0;const j=await r.json();const jd=(j.container||j).json_dict||j;const out={lists:{},decks:(jd.card||{}).num_decks};
    for(const L of jd.cardlists||[])out.lists[L.tag]=L.cardviews.map(c=>({n:c.name,s:+(c.synergy||0).toFixed(3),d:c.num_decks||0,p:c.potential_decks||1,l:+(c.lift||0).toFixed(2),z:+(c.trend_zscore||0).toFixed(2)}));
    S.live[deck.slug]=out;if(!deck.decks&&out.decks)deck.decks=out.decks;$('#livest').textContent='EDHREC live: on';return out;
  }catch(e){S.live[deck.slug]=null;$('#livest').textContent='EDHREC live: blocked, using snapshot';return null}
}
function statsFor(deck){ // name(norm) -> {s,d,p,l,z,list}
  const src=S.live[deck.slug]||deck;const m={};
  for(const [tag,arr] of Object.entries(src.lists||{}))for(const c of arr){const k=norm(c.n);if(!m[k]||tag==='newcards')m[k]={...c,list:tag}}
  return m;
}

// ---------- scryfall ----------
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function scryPages(q,max=3){
  let url='https://api.scryfall.com/cards/search?unique=cards&order=released&dir=desc&q='+encodeURIComponent(q),out=[];
  for(let i=0;i<max&&url;i++){const r=await fetch(url);if(r.status===404)break;if(!r.ok)throw new Error('Scryfall '+r.status);const j=await r.json();out=out.concat(j.data||[]);url=j.has_more?j.next_page:null;if(url)await sleep(120)}
  return out;
}
async function newCards(ci){
  const key=ciKey(ci)+'|'+S.since+'|'+S.reprints;if(S.scry[key])return S.scry[key];
  const id=ci.length?'id<='+ci.join(''):'id=c';
  const q=`${id} legal:commander date>=${S.since} ${S.reprints?'':'-is:reprint'} -t:basic -is:funny game:paper`;
  const cards=(await scryPages(q,4)).map(slim);S.scry[key]=cards;return cards;
}
async function cardsNamed(names){ // batch via /cards/collection (75 per call)
  const out=[];for(let i=0;i<names.length;i+=75){const chunk=names.slice(i,i+75).map(name=>({name}));
    const r=await fetch('https://api.scryfall.com/cards/collection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifiers:chunk})});
    if(r.ok){const j=await r.json();out.push(...(j.data||[]).map(slim))}await sleep(120)}
  return out;
}
function slim(c){const f=c.card_faces?.[0]||{};return{name:c.name,mana:c.mana_cost||f.mana_cost||'',type:c.type_line||f.type_line||'',oracle:c.oracle_text||c.card_faces?.map(x=>x.oracle_text).join('\n//\n')||'',set:c.set_name,setcode:c.set,date:c.released_at,ci:c.color_identity||[],img:c.image_uris?.small||f.image_uris?.small||'',uri:c.scryfall_uri,rank:c.edhrec_rank,price:c.prices?.usd,usd:c.prices?.usd!=null?+c.prices.usd:null,gc:!!c.game_changer,border:c.border_color,fx:c.frame_effects||[],promo:!!c.promo,full:!!c.full_art,cn:c.collector_number,imgN:c.image_uris?.normal||f.image_uris?.normal||'',artc:c.image_uris?.art_crop||f.image_uris?.art_crop||'',loyalty:c.loyalty??f.loyalty,cmc:c.cmc,power:c.power??f.power,toughness:c.toughness??f.toughness,keywords:c.keywords||[]}}
async function commanderCard(deck){if(S.cmdr[deck.slug])return S.cmdr[deck.slug];
  try{const r=await fetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(deck.name));if(r.ok){S.cmdr[deck.slug]=slim(await r.json());return S.cmdr[deck.slug]}}catch(e){}return null}

// ---------- scoring + use case ----------
function score(card,st,deck,theme){
  let s=0;const why=[];
  if(st){s+=st.s*100;s+=pct(st.d,st.p)*0.6;if(st.z>1){s+=Math.min(st.z,10)*2;why.push('trending up')}}
  else if(card.rank){s+=Math.max(0,30-card.rank/800)}
  const roles=rolesOf(card.oracle);const fit=roles.filter(r=>theme.has(r));s+=fit.length*12;
  if(/legendary/i.test(card.type)&&/legend/i.test((deck.tags||[]).join()))s+=6;
  if(S.cmdr[deck.slug]){const ct=S.cmdr[deck.slug].oracle||'';const words=['token','counter','artifact','enchantment','instant','sorcery','land','graveyard','attack','dies','sacrifice','draw','treasure','energy','exile'];for(const w of words)if(new RegExp(w,'i').test(ct)&&new RegExp(w,'i').test(card.oracle)){s+=4;if(!fit.length)why.push('shares "'+w+'" with commander')}}
  return{s:Math.round(s),roles,fit,why};
}
function useCase(card,st,deck,sc,list){
  const parts=[];
  if(sc.roles.length)parts.push(`<b>${esc(sc.roles.slice(0,3).join(' · '))}</b>`);else parts.push('<b>Niche effect</b>');
  if(sc.fit.length)parts.push(`fits ${esc(deck.name.split(',')[0])}'s ${esc((deck.tags||[]).slice(0,2).join('/')||'core')} plan through ${esc(sc.fit.join(' and '))}`);
  if(st){const inc=pct(st.d,st.p);const syn=Math.round(st.s*100);
    parts.push(`EDHREC: in <b>${inc}%</b> of ${fmt(st.p)} eligible decks, synergy <b>${syn>0?'+':''}${syn}</b>${syn>=20?' (strongly commander-specific)':syn<=-10?' (worse here than in other decks)':''}`);
    if(st.z>2)parts.push('adoption rising fast');}
  else if(card.rank)parts.push(`EDHREC rank #${fmt(card.rank)} overall, not yet in this commander's data`);
  else parts.push('too new for EDHREC data');
  if(sc.why.length)parts.push(esc(sc.why.join(', ')));
  let swap='';
  if(list&&list.length){const cand=swapFor(card,sc,deck,list);if(cand)swap=`<div class="swap">Likely cut: <b>${esc(cand.name)}</b> — ${esc(cand.reason)}</div>`;else swap=`<div class="swap">No obvious cut with the same role; it would be an addition, not a swap.</div>`}
  else swap=`<div class="swap">Paste your list in the "Your list" tab to get cut suggestions.</div>`;
  return parts.join('. ')+'.'+swap;
}
function commanderNames(deck){const n=[deck.name];if(deck.realName)n.push(deck.realName);if(deck.display&&deck.display.includes(' / '))n.push(...deck.display.split(' / '));return new Set(n.map(norm))}
function swapFor(card,sc,deck,list){ // list: [{name,oracle,type,roles}] with edhrec stats attached; commander(s) never a cut
  const cmd=commanderNames(deck);
  const same=list.filter(x=>!cmd.has(norm(x.name))&&x.roles.some(r=>sc.roles.includes(r))&&!/\bLand\b/.test(x.type.split(' // ')[0]));
  if(!same.length)return null;
  same.sort((a,b)=>(a.st?a.st.s:-1)-(b.st?b.st.s:-1));
  const w=same[0];const reason=w.st?`same role, lowest synergy in your list (${Math.round(w.st.s*100)}, in ${pct(w.st.d,w.st.p)}% of decks)`:'same role, not in EDHREC\'s list for this commander';
  return{name:w.name,reason};
}

// ---------- db ----------
async function initDb(){try{const raw=localStorage.getItem('decks');if(raw)S.decks=JSON.parse(raw);const c=localStorage.getItem('cfg');if(c)S.cfg=JSON.parse(c)}catch(e){}S.db=true;buildIndex()}
async function saveDeck(slug,patch){const cur=S.decks[slug]||{};S.decks[slug]={...cur,...patch,updatedAt:new Date().toISOString()};try{localStorage.setItem('decks',JSON.stringify(S.decks))}catch(e){console.warn('storage',e)}syncSoon()}

// ---------- sync: one private GitHub Gist holds your decks; every device merges with it, newest edit of each deck wins ----------
const SYNC_FILE='upgrade-radar.json';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const syncTok=()=>lsGet('sync-token');
function syncStatus(t,err){S.syncMsg=t;S.syncErr=!!err;const b=$('#syncbtn');if(b){b.textContent='Sync: '+(syncTok()?(err?'error':'on'):'off');b.style.color=err?'var(--bad, #e66)':''}const m=$('#syncstate');if(m)m.textContent=t||''}
function cleanDecks(ds){const o={};for(const [k,v] of Object.entries(ds||{})){const c={};for(const [kk,vv] of Object.entries(v||{}))if(kk[0]!=='_')c[kk]=vv;o[k]=c}return o}
function mergeDecks(local,remote){const out={...remote};for(const [k,v] of Object.entries(local)){const r=remote[k];if(!r||String(v.updatedAt||'')>String(r.updatedAt||''))out[k]=v}return out}
async function gh(path,opt={}){const r=await fetch('https://api.github.com'+path,{cache:'no-store',...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+syncTok(),...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===401)throw new Error('GitHub rejected the token (expired or revoked?)');if(r.status===403||r.status===404&&!opt.soft)throw new Error('GitHub refused ('+r.status+') — does the token have the gist scope?');if(!r.ok&&!opt.soft)throw new Error('GitHub error '+r.status);return r}
async function findGist(){let id=lsGet('sync-gist');if(id){const r=await gh('/gists/'+id,{soft:true});if(r.ok)return {id,gist:await r.json()};}
  for(let page=1;page<=5;page++){const list=await (await gh('/gists?per_page=100&page='+page)).json();const g=list.find(x=>x.files&&x.files[SYNC_FILE]);if(g){lsSet('sync-gist',g.id);return {id:g.id,gist:await (await gh('/gists/'+g.id)).json()}}if(list.length<100)break}
  return null}
let syncTimer=null,syncing=null;
function syncSoon(){if(!syncTok())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1500)}
async function syncNow(){if(!syncTok())return false;if(syncing){await syncing.catch(()=>{});}
  syncing=(async()=>{syncStatus('Syncing…');
    const found=await findGist();let remote={decks:{},cfg:null,pt:null};
    if(found){const f=found.gist.files[SYNC_FILE];let txt=f.content;if(f.truncated)txt=await (await fetch(f.raw_url,{cache:'no-store'})).text();try{remote={...remote,...JSON.parse(txt||'{}')}}catch(e){}}
    const local=cleanDecks(S.decks);const merged=mergeDecks(local,cleanDecks(remote.decks));
    // keep this device's in-memory extras (enriched card data) for decks that didn't change
    const next={};for(const [k,v] of Object.entries(merged)){const old=S.decks[k];next[k]=old&&old.updatedAt===v.updatedAt?old:v}
    const changedLocal=JSON.stringify(cleanDecks(S.decks))!==JSON.stringify(merged);
    S.decks=next;lsSet('decks',JSON.stringify(S.decks));
    if(!S.cfg&&remote.cfg){S.cfg=remote.cfg;lsSet('cfg',JSON.stringify(S.cfg))}
    if(!lsGet('pt-settings')&&remote.pt)lsSet('pt-settings',JSON.stringify(remote.pt));
    let pt=null;try{pt=JSON.parse(lsGet('pt-settings')||'null')}catch(e){}
    const body={decks:merged,cfg:S.cfg||remote.cfg||null,pt:pt||remote.pt||null,savedAt:new Date().toISOString()};
    const same=JSON.stringify({d:body.decks,c:body.cfg,p:body.pt})===JSON.stringify({d:cleanDecks(remote.decks),c:remote.cfg||null,p:remote.pt||null});
    if(!found){const g=await (await gh('/gists',{method:'POST',body:JSON.stringify({description:'MTG Dashboard sync (private)',public:false,files:{[SYNC_FILE]:{content:JSON.stringify(body)}}})})).json();lsSet('sync-gist',g.id)}
    else if(!same)await gh('/gists/'+found.id,{method:'PATCH',body:JSON.stringify({files:{[SYNC_FILE]:{content:JSON.stringify(body)}}})});
    lsSet('sync-last',new Date().toISOString());
    if(changedLocal){buildIndex();if(!$('#home').hidden)renderHome()}
    syncStatus('Synced '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · '+Object.keys(merged).length+' decks');return true})();
  try{return await syncing}catch(e){syncStatus(e.message,true);return false}finally{syncing=null}}
function toggleSync(open){const p=$('#syncpanel');p.hidden=!open;if(!open)return;const on=!!syncTok();
  p.innerHTML=`<h3>Sync across devices</h3>
   <p class="note">Your decks are kept in one <b>secret Gist</b> on your GitHub account. Each device merges with it whenever you save or come back to the page; if the same deck was edited on two devices, the newer edit wins.</p>
   ${on?'':`<ol class="note" style="margin:0;padding-left:18px"><li><a href="https://github.com/settings/tokens/new?scopes=gist&description=MTG%20Dashboard%20sync" target="_blank" rel="noopener">Create a GitHub token</a> — the <b>gist</b> box is pre-ticked; leave everything else unticked. Pick an expiry (or "No expiration").</li><li>Copy the token, paste it below, tap Connect. Do the same on each device (you can reuse the same token).</li></ol>
   <div class="f"><label for="synctok">GitHub token</label><input id="synctok" type="password" autocomplete="off" placeholder="ghp_…"></div>`}
   <div class="row">${on?'<button class="chip" id="syncgo">Sync now</button><button class="chip" id="syncoff">Disconnect this device</button>':'<button class="chip" id="syncon">Connect</button>'}<button class="chip" id="syncclose">Close</button><span class="note" id="syncstate">${esc(S.syncMsg||'')}</span></div>
   <p class="note">The token is stored only in this browser. It can read and write your Gists and nothing else. Revoke it any time at github.com → Settings → Developer settings → Tokens.</p>`;
  $('#syncclose').onclick=()=>toggleSync(false);
  if(on){$('#syncgo').onclick=()=>syncNow();$('#syncoff').onclick=()=>{lsSet('sync-token',null);lsSet('sync-gist',null);syncStatus('Disconnected — decks stay on this device.');toggleSync(true)}}
  else $('#syncon').onclick=async()=>{const t=$('#synctok').value.trim();if(!t)return syncStatus('Paste the token first.',true);lsSet('sync-token',t);const ok=await syncNow();if(!ok)lsSet('sync-token',null);else toggleSync(true);syncStatus(S.syncMsg,!ok)};
}
function exportData(){const blob=new Blob([JSON.stringify({decks:S.decks,cfg:S.cfg||null,exported:new Date().toISOString()},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mtg-dashboard-data.json';a.click()}
function importData(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);S.decks=j.decks||{};S.cfg=j.cfg||S.cfg;localStorage.setItem('decks',JSON.stringify(S.decks));if(S.cfg)localStorage.setItem('cfg',JSON.stringify(S.cfg));buildIndex();renderHome();syncSoon()}catch(e){alert('Not a valid export file')}};r.readAsText(file)}
function parseList(txt){return parseListFull(txt).map(x=>x.name)}
function parseListFull(txt){ // handles Archidekt, Moxfield, MTGO and plain exports; keeps "(SET) 123" printings for alt-art images
  const lines=[];let skip=false;
  for(const raw of txt.split(/\r?\n/)){const l=raw.trim();if(!l)continue;
    const head=l.replace(/^(\/\/|#)\s*/,'').replace(/\s*:?\s*$/,'').toLowerCase();
    if(/^(sideboard|maybeboard|maybe|considering|tokens?)$/.test(head)){skip=true;continue}   // cards under these headers are not in the 99
    if(/^(commander|commanders|deck|main|mainboard|companion)$/.test(head)){skip=false;continue}
    if(/^(\/\/|#)/.test(l))continue;
    if(!skip){const q=l.match(/^(\d+)\s*x?\s+/i);const n=q?Math.min(+q[1],99):1;for(let i=0;i<n;i++)lines.push(l)}}
  return lines
    .map(l=>l.replace(/\s*\[[^\]]*\]/g,'')          // Archidekt [Category] / [Commander{top}]
             .replace(/\s*\^[^^]*\^/g,'')            // Archidekt ^colour tags^
             .replace(/\s*\*[A-Z]+\*/g,'')           // *F* foil / *E* etched
             .replace(/\s+#!?[^\s#]+/g,'')           // Moxfield #tags / #!global tags
             .replace(/^\d+\s*x?\s+/i,''))           // "1x " / "1 "
    .map(l=>{const m=l.match(/\s*\(([A-Za-z0-9]{2,6})\)\s*([\w★†-]*)\s*$/);const name=l.replace(/\s*\([A-Za-z0-9]{2,6}\)\s*[\w★†-]*\s*$/,'') // (SET) 123
             .replace(/\s*\/\/?\s*.*$/,'')          // double-faced "Front / Back" or "Front // Back": Scryfall finds it by the front name
             .trim();return {name,print:m&&m[2]?m[1].toLowerCase()+'/'+m[2].toLowerCase():null}})
    .filter(x=>x.name)}
function printsOf(full){const o={};for(const x of full)if(x.print&&!o[norm(x.name)])o[norm(x.name)]=x.print;return o}
function listText(dk){const m=new Map();for(const n of dk.list||[])m.set(n,(m.get(n)||0)+1);const pr=dk.prints||{};return [...m].map(([n,k])=>{const p=pr[norm(n)];return k+' '+n+(p?` (${p.split('/')[0].toUpperCase()}) ${p.split('/')[1]}`:'')}).join('\n')}

// ---------- index: snapshot + your additions/retirements ----------
const slugify=n=>n.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/['.,]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function buildIndex(){
  const base=S.snap.commanders.map(c=>({...c}));const have=new Set(base.map(c=>c.slug));
  for(const [slug,dk] of Object.entries(S.decks))if(dk.custom&&!have.has(slug))base.push({name:dk.name,display:dk.name,bracket:dk.bracket||'3',slug,ci:[],tags:[],lists:{},decks:0,custom:true});
  for(const d of base){const dk=S.decks[d.slug]||{};d.retired=!!dk.retired;if(dk.bracket)d.bracket=dk.bracket;

async function fetchFx(){const today=new Date().toISOString().slice(0,10);if(P.fx&&P.fxDate===today)return;

function toggleCheck(open){const p=$('#checkpanel');p.hidden=!open;if(!open)return;

   ${ds.length?'':`<p class="warn">This browser has no saved decklists, so there is nothing to check. Lists live in the browser where you pasted them. ${syncTok()?'Sync is on — tap Sync → Sync now to pull lists from your other devices.':'To see lists you saved on another device or browser, turn on <b>Sync</b> on both with the same GitHub token.'}</p>`}

      const names=[...where.values()].map(x=>x.name);msg.textContent=`Fetching ${names.length} cards from Scryfall…`;
      const cards=await cardsNamed(names);const found=new Set();
      const rows=[];for(const c of cards){const k=norm(c.name);found.add(k);const w=where.get(k)||{decks:new Set()};if(/^(Basic )?Land — (Plains|Island|Swamp|Mountain|Forest)$|^Basic Land/.test(c.type))continue;
        let a;try{a=Goldfish.auditCard(c)}catch(e){a={lines:[{line:'(engine error: '+e.message+')',status:'missing'}],missing:1,generic:0}}
        rows.push({c,a,decks:[...w.decks]})}
      const missing=rows.filter(r=>r.a.missing),cond=rows.filter(r=>!r.a.missing&&r.a.generic),fine=rows.length-missing.length-cond.length;
      const notFound=[...where.entries()].filter(([k])=>!found.has(k)).map(([,v])=>v.name);
      const li=r=>`<li><b>${esc(r.c.name)}</b> <span class="note">· ${esc(r.decks.join(', '))}</span><ul style="margin:2px 0 6px;padding-left:16px">${r.a.lines.filter(x=>x.status==='missing'||x.status==='generic').map(x=>`<li class="note">${x.status==='missing'?'✗':'?'} ${esc(x.line)}</li>`).join('')}</ul></li>`;
      const flagged=[...missing,...cond];S.checkReport=JSON.stringify({generated:new Date().toISOString(),engine:'v36',cards:flagged.map(r=>[0,r.c.name,r.c.mana,r.c.type,r.c.oracle,r.c.cmc,r.c.power??null,r.c.toughness??null,r.c.loyalty??null,r.a.lines.filter(x=>x.status!=='ok'&&x.status!=='tested').map(x=>(x.status==='missing'?'MISSING ':'COND ')+x.line)]),notFound});
      $('#chkres').innerHTML=`<p><b>${rows.length}</b> cards checked: <b>${fine}</b> fully covered, <b>${cond.length}</b> with a condition unverified, <b>${missing.length}</b> with text not modelled.${notFound.length?` <span class="err">${notFound.length} name${notFound.length===1?'':'s'} not found on Scryfall: ${esc(notFound.join(', '))}</span>`:''}</p>
        ${flagged.length?`<div class="row"><button class="chip pri" id="chkcopy">Copy report for Claude</button><button class="chip" id="chkdl">Download report</button><span class="note" id="chkcopied"></span></div>`:''}
        ${missing.length?`<h4>Not modelled</h4><ul style="padding-left:18px">${missing.map(li).join('')}</ul>`:''}
        ${cond.length?`<h4>Condition unverified</h4><ul style="padding-left:18px">${cond.map(li).join('')}</ul>`:''}`;
      if(flagged.length){$('#chkcopy').onclick=async()=>{try{await navigator.clipboard.writeText(S.checkReport);$('#chkcopied').textContent='Copied — paste it into the chat.'}catch(e){$('#chkcopied').textContent='Copy blocked by the browser — use Download.'}};
        $('#chkdl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([S.checkReport],{type:'application/json'}));a.download='rules-check.json';a.click()}}
      msg.textContent='';
    }catch(e){msg.textContent='Check failed: '+e.message}finally{$('#chkgo').disabled=false}};
}

(function(){const b=document.getElementById('filtbtn');if(b)b.onclick=()=>{const on=document.body.classList.toggle('ctlopen');b.setAttribute('aria-expanded',on);b.setAttribute('aria-pressed',on);};})();
function showView(v){$('#home').hidden=v!=='home';$('#detail').hidden=v!=='detail';$('#play').hidden=v!=='play';if(v!=='detail')S.cur=null;
  document.body.classList.toggle('playing',v==='play');$('#nav-decks').toggleAttribute('aria-current',v!=='play');$('#nav-play').toggleAttribute('aria-current',v==='play');
  if(v==='play'){if(location.hash!=='#playtest')history.replaceState(null,'','#playtest')}else if(location.hash==='#playtest')history.replaceState(null,'',location.pathname+location.search);
  window.scrollTo(0,0)}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error(src+' failed to load'));document.head.appendChild(s)})}
let ptLoaded=null;function loadPlaytest(){if(!ptLoaded)ptLoaded=loadScript('playtest.js?v=36').then(()=>loadScript('playtest-ui.js?v=36'));return ptLoaded}
const PT={cfg:null,table:null};
/** the saved list as a Moxfield/Archidekt-style visual grid, grouped by type, plus a Playtest-pool check */
const GRIDCACHE=new Map();
async function renderDeckGrid(d,stale){
  const el=$('#lstgrid'),msg=$('#lstmsg');if(!el)return;
  const list=(S.decks[d.slug]&&S.decks[d.slug].list)||[];
  if(!list.length){el.innerHTML='';msg.textContent='';return}
  const cmd=commanderNames(d);const ninety=list.filter(n=>!cmd.has(norm(n)));
  const inPool=list.length>=60;
  msg.innerHTML=`<b style="color:var(--good)">✓ Saved</b> · ${list.length} cards (${ninety.length} in the 99) · ${inPool?'<b>in the Playtest pool</b>':'<span style="color:var(--warn)">Playtest needs 60+ cards</span>'}`;
  el.innerHTML='<div class="note">Loading card images…</div>';
  const uniq=[...new Set(list)];const need=uniq.filter(n=>!GRIDCACHE.has(norm(n)));
  try{const got=await cardsNamed(need);for(const c of got){GRIDCACHE.set(norm(c.name),c);GRIDCACHE.set(norm(c.name.split(' // ')[0]),c)}}catch(e){}
  // the exact printings from the export (alt arts, Final Fantasy / Secret Lair versions…)
  const dk0=S.decks[d.slug]||{};const prints={...(dk0.prints||{})};if(dk0.cmdrPrint)for(const n of cmd)prints[n]=dk0.cmdrPrint;
  const wantP=[...new Set(Object.values(prints))].filter(p=>!GRIDCACHE.has('p:'+p));
  try{for(let i=0;i<wantP.length;i+=75){const ids=wantP.slice(i,i+75).map(p=>({set:p.split('/')[0],collector_number:p.split('/')[1]}));
    const r=await fetch('https://api.scryfall.com/cards/collection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifiers:ids})});
    if(r.ok){const j=await r.json();for(const c of (j.data||[]).map(slim))GRIDCACHE.set('p:'+c.setcode+'/'+String(c.cn).toLowerCase(),c)}await sleep(120)}}catch(e){}
  const art=(k,c)=>{const p=prints[k];const pc=p&&GRIDCACHE.get('p:'+p);return pc&&pc.img?{...c,img:pc.img,uri:pc.uri||c.uri}:c};
  if(stale&&stale())return;
  let cmdCard=null;for(const n of cmd){const c=GRIDCACHE.get(n);if(c){cmdCard=art(n,c);break}}
  if(!cmdCard){cmdCard=S.cmdr[d.slug]||await commanderCard(d);const n=[...cmd][0];if(cmdCard)cmdCard=art(n,cmdCard)}
  const counts=new Map();for(const n of ninety){const k=norm(n);counts.set(k,(counts.get(k)||0)+1)}
  const groups=[['Creatures',/\bCreature\b/],['Planeswalkers',/\bPlaneswalker\b/],['Battles',/\bBattle\b/],['Instants',/\bInstant\b/],['Sorceries',/\bSorcery\b/],['Artifacts',/\bArtifact\b/],['Enchantments',/\bEnchantment\b/],['Lands',/\bLand\b/]];
  const buckets=new Map(groups.map(g=>[g[0],[]]));const missing=[];
  for(const [k,n] of counts){const c0=GRIDCACHE.get(k);const c=c0&&art(k,c0);if(!c){missing.push([...ninety].find(x=>norm(x)===k));continue}
    const front=(c.type||'').split(' // ')[0];const g=/\bLand\b/.test(front)?'Lands':(groups.find(([,re])=>re.test(front))||['Artifacts'])[0];buckets.get(g).push({c,n})}
  const tile=({c,n})=>`<a class="dg-c" href="${esc(c.uri||'#')}" target="_blank" rel="noopener" title="${esc(c.name)}">${c.img?`<img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy">`:`<span>${esc(c.name)}</span>`}${n>1?`<b class="dg-n">×${n}</b>`:''}${(()=>{const e=P.m[norm(c.name)];return e&&e.u!=null&&e.u*(P.fx||FX_FALLBACK)>=1?`<b class="dg-p">${sgd(e.u*n)}</b>`:''})()}</a>`;
  const sect=(title,items)=>items.length?`<div class="dg-s"><h4>${title} <small>${items.reduce((s,x)=>s+x.n,0)}</small></h4><div class="dg">${items.sort((a,b)=>(a.c.cmc||0)-(b.c.cmc||0)||a.c.name.localeCompare(b.c.name)).map(tile).join('')}</div></div>`:'';
  el.innerHTML=(missing.length?`<p class="note" style="color:var(--warn)">Not found on Scryfall (check spelling): ${missing.map(esc).join(', ')}</p>`:'')
    +(cmdCard?sect('Commander',[{c:cmdCard,n:1}]):'')
    +groups.map(([g])=>sect(g,buckets.get(g))).join('');
}
function renderCost(d){const el=$('#costbox');if(!el)return;const st=deckStats(d);const dk=S.decks[d.slug]||{};
  if(!st){el.innerHTML=P.busy?`<div class="costbox note">Pricing cards… ${P.done}/${P.todo}</div>`:'';return}
  const counts=new Map();const cmd=commanderNames(d);const names=[...dk.list];if(!names.some(n=>cmd.has(norm(n))))names.push(d.name);for(const n of names)counts.set(n,(counts.get(n)||0)+1);
  const rows=[...counts].map(([n,k])=>({n,k,e:P.m[norm(n)]})).sort((a,b)=>((b.e&&b.e.u)||0)*b.k-((a.e&&a.e.u)||0)*a.k);
  const unpriced=rows.filter(r=>!r.e||r.e.u==null);
  el.innerHTML=`<div class="costbox"><div><b>Deck cost ${sgd2(st.usd)}</b> <span class="note">· ${st.n} cards · regular printing, non-foil, NM · TCGplayer market via Scryfall at ${(P.fx||FX_FALLBACK).toFixed(3)} SGD/USD${st.missing?' · '+st.missing+' unpriced':''}</span></div>
   ${st.gc.length?`<div class="note">Game Changers (${st.gc.length}): ${st.gc.map(esc).join(', ')}</div>`:''}
   <details><summary class="note" style="cursor:pointer">All cards by price — tap a name to check Singapore stores on Gishath Fetch</summary><table>${rows.map(r=>`<tr><td><a href="${gishath(r.n)}" target="_blank" rel="noopener">${esc(r.n)}</a>${r.k>1?' ×'+r.k:''}${r.e&&r.e.gc?' <span class="tag">GC</span>':''}</td><td class="r">${r.e&&r.e.u!=null?sgd2(r.e.u*r.k):'<span class="note">no price</span>'}</td></tr>`).join('')}</table></details>
   ${unpriced.length?`<div class="note">No Scryfall price: ${unpriced.map(r=>esc(r.n)).join(', ')}</div>`:''}</div>`}
function decksWithLists(){return S.index.filter(d=>!d.retired&&S.decks[d.slug]?.list?.length>=60)}
async function openPlaytest(){
  if(PT.table){PT.table.aborted=true;PT.table=null}
  showView('play');const el=$('#play');el.innerHTML='<div class="empty">Loading the table…</div>';
  try{await loadPlaytest()}catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  const ds=decksWithLists();
  if(ds.length<2){el.innerHTML=`<h2 style="font-size:1.4rem">Playtest</h2><div class="empty">Playtest needs at least 2 decks with a saved list of 60+ cards (you have ${ds.length}). Open a deck in <b>Decks</b> → "Your list" → paste your Archidekt or Moxfield export → Save, then come back.</div>`;return}
  const opt=ds.map(d=>`<option value="${esc(d.slug)}">${esc(d.display||d.name)}</option>`).join('');
  const lv=id=>`<select id="${id}"><option value="casual">Casual</option><option value="focused">Focused</option><option value="cutthroat">Cutthroat</option><option value="expert" selected>Expert</option></select>`;
  const prev=PT.cfg||{};
  el.innerHTML=`<h2 style="font-size:1.4rem;margin-bottom:4px">Playtest</h2>
   <p class="note" style="max-width:760px">Four-player Commander table. You pilot seat 1 against three AI opponents running your other decks. The AI counters spells it judges dangerous, removes attackers at instant speed, holds mana up and blocks to survive. The engine reads card types, costs, colours, power/toughness, keywords and roles (ramp, draw, removal, wipes, counterspells, tokens, pump), but <b>not</b> each card's unique text, so engines and combos don't run. Use it to test curve, speed and interaction.</p>
   <div class="pt-setup">
    <div class="seat"><h3>Seat 1 — you</h3><div class="row"><select id="s0">${opt}</select><label class="note"><input type="checkbox" id="watch" ${prev.watch?'checked':''}> AI pilots this seat too (watch mode)</label></div><div class="row" id="w0" ${prev.watch?'':'hidden'}>${lv('l0')}</div></div>
    ${[1,2,3].map(i=>`<div class="seat"><h3>Seat ${i+1} — AI</h3><div class="row"><select id="s${i}">${opt}</select>${lv('l'+i)}</div></div>`).join('')}
    <div class="row"><button class="chip" id="ptrand">Randomize AI decks</button><button class="chip" id="ptrandall">Randomize all decks</button><button class="chip" id="ptlvl">Randomize difficulty</button><button class="chip pri" id="ptstart">Start game</button></div>
    <p class="note">Difficulty — <b>Casual</b>: plays its hand, attacks the lowest life, counters loosely and misses things. <b>Focused</b>: attacks the biggest threat, keeps blockers back, counters engines, commanders and anything aimed at its board. <b>Cutthroat</b>: weighs engines, card advantage and mana, holds counter mana up early, saves free counters for game-changing spells, takes lethal first and races when ahead. <b>Expert</b> (default): built on Focused's judgement, which beat Cutthroat's in self-play with real decks, plus EDHREC staple knowledge, spreading attackers to whoever they actually get through to, holding back creatures when a board wipe looks likely, and sacrificing creatures in response to removal when it has an outlet.</p>
   </div>`;
  const pick=()=>{const used=new Set([$('#s0').value]);for(const i of [1,2,3]){const pool=ds.filter(d=>!used.has(d.slug));const d=pool.length?pool[Math.floor(Math.random()*pool.length)]:ds[Math.floor(Math.random()*ds.length)];$('#s'+i).value=d.slug;used.add(d.slug)}};
  if(prev.slugs){prev.slugs.forEach((s,i)=>{if(ds.some(d=>d.slug===s))$('#s'+i).value=s});prev.levels.forEach((l,i)=>{if(l&&$('#l'+i))$('#l'+i).value=l})}else pick();
  $('#ptrand').onclick=pick;$('#ptrandall').onclick=()=>{$('#s0').value=ds[Math.floor(Math.random()*ds.length)].slug;pick()};$('#ptlvl').onclick=()=>{for(const i of [1,2,3])$('#l'+i).value=['casual','focused','cutthroat','expert'][Math.floor(Math.random()*4)]};
  $('#watch').onchange=()=>{$('#w0').hidden=!$('#watch').checked};
  $('#ptstart').onclick=()=>{PT.cfg={slugs:[0,1,2,3].map(i=>$('#s'+i).value),levels:[0,1,2,3].map(i=>$('#l'+i)?$('#l'+i).value:null),watch:$('#watch').checked};startGame(PT.cfg)};
}
/** EDHREC popularity (share of decks running a card) for every commander's lists: the AI treats widely played cards as strong */
function popularityMap(){const m={};for(const c of (S.snap&&S.snap.commanders)||[])for(const v of Object.values(c.lists||{}))for(const x of v){const s=x.p?x.d/x.p:0;if(s>(m[x.n]||0))m[x.n]=s}return m}
async function startGame(cfg){
  const el=$('#play');el.innerHTML='<div class="empty">Fetching cards from Scryfall…</div>';
  if(Goldfish.setPopularity)Goldfish.setPopularity(popularityMap());
  const seats=[];
  for(let i=0;i<4;i++){const d=S.index.find(x=>x.slug===cfg.slugs[i]);const list=S.decks[d.slug].list;
    let cards=[];try{cards=await cardsNamed([...new Set(list)])}catch(e){}
    const byName=new Map(cards.map(c=>[norm(c.name),c]));const cmd=commanderNames(d);
    const full=list.map(n=>byName.get(norm(n))).filter(Boolean);
    let cmdCards=[...cmd].map(n=>byName.get(n)).filter(Boolean);
    if(!cmdCards.length){const cc=S.cmdr[d.slug]||await commanderCard(d);if(cc)cmdCards=[cc]}
    const deck=Goldfish.buildDeck(full.filter(c=>!cmd.has(norm(c.name))).concat(cmdCards),cmdCards.map(c=>c.name));
    if(deck.library.length<40){el.innerHTML=`<div class="empty">${esc(d.name)}: only ${deck.library.length} cards were found on Scryfall. Check the list for typos.</div><button class="chip" id="ptback2">Back to setup</button>`;$('#ptback2').onclick=openPlaytest;return}
    const human=i===0&&!cfg.watch;
    seats.push({name:(human?'You · ':'AI · ')+(d.display||d.name).split(',')[0],deckName:d.display||d.name,deck,human,level:human?null:(cfg.levels[i]||'expert'),art:d.art||(cmdCards[0]&&cmdCards[0].img||'').replace('/small/','/art_crop/')});
  }
  el.innerHTML='';PT.table=GoldfishUI.start(el,seats,{onExit:openPlaytest,onRematch:()=>startGame(cfg)});
}

// ---------- controls ----------
function wire(){
  const dflt=new Date(Date.now()-90*864e5).toISOString().slice(0,10);
  let saved=null;try{saved=localStorage.getItem('since')}catch(e){}
  S.since=saved||dflt;$('#since').value=S.since;
  $('#since').onchange=()=>{S.since=$('#since').value||dflt;try{localStorage.setItem('since',S.since)}catch(e){}if(S.cur)renderTab()};
  let fsaved=null;try{fsaved=JSON.parse(localStorage.getItem('filters')||'null')}catch(e){}
  if(fsaved){S.brackets=new Set(fsaved.b||['2','3','4','cEDH']);S.colors=new Set(fsaved.c||[]);S.cmode=fsaved.m||'any'}
  const syncF=()=>{document.querySelectorAll('.chip[data-b]').forEach(b=>b.setAttribute('aria-pressed',S.brackets.has(b.dataset.b)));document.querySelectorAll('.chip[data-c]').forEach(b=>b.setAttribute('aria-pressed',S.colors.has(b.dataset.c)));$('#cmode').value=S.cmode;
    $('#fclear').hidden=!S.colors.size&&S.brackets.size===4;lsSet('filters',JSON.stringify({b:[...S.brackets],c:[...S.colors],m:S.cmode}))};
  const toHome=()=>{if(S.cur){showView('home')}renderHome()};
  document.querySelectorAll('.chip[data-b]').forEach(b=>b.onclick=e=>{const k=b.dataset.b;if(e.shiftKey||e.altKey){S.brackets=new Set([k])}else if(S.brackets.has(k))S.brackets.delete(k);else S.brackets.add(k);if(!S.brackets.size)S.brackets=new Set(['2','3','4','cEDH']);syncF();toHome()});
  document.querySelectorAll('.chip[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(S.colors.has(c))S.colors.delete(c);else S.colors.add(c);syncF();toHome()});
  $('#cmode').onchange=()=>{S.cmode=$('#cmode').value;syncF();toHome()};
  $('#fclear').onclick=()=>{S.colors.clear();S.brackets=new Set(['2','3','4','cEDH']);syncF();toHome()};syncF();
  $('#q').oninput=()=>{S.q=$('#q').value.trim().toLowerCase();if((S.cur||!$('#play').hidden)&&S.q){showView('home')}renderHome()};
  $('#addbtn').onclick=()=>toggleAdd($('#addpanel').hidden);$('#nav-play').onclick=openPlaytest;$('#nav-decks').onclick=()=>{if(PT.table){PT.table.aborted=true;PT.table=null}showView('home');renderHome()};$('#expbtn').onclick=exportData;$('#syncbtn').onclick=()=>toggleSync($('#syncpanel').hidden);$('#checkbtn').onclick=()=>toggleCheck($('#checkpanel').hidden);$('#bulkbtn').onclick=()=>toggleBulk($('#bulkpanel').hidden);$('#impfile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};
  let sortSaved=null,themeSaved=null;try{sortSaved=localStorage.getItem('sort');themeSaved=localStorage.getItem('theme')}catch(e){}
  S.sort=sortSaved||'name';$('#sort').value=S.sort;$('#sort').onchange=()=>{S.sort=$('#sort').value;try{localStorage.setItem('sort',S.sort)}catch(e){}renderHome()};
  const applyTheme=t=>{if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);$('#theme').textContent='Theme: '+t};
  S.theme=themeSaved||'system';applyTheme(S.theme);
  $('#theme').onclick=()=>{const order=['system','dark','light'];S.theme=order[(order.indexOf(S.theme)+1)%3];try{localStorage.setItem('theme',S.theme)}catch(e){}applyTheme(S.theme)};
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
}
/** commander tiles use the printing you chose (Edit commander) or the one in your export */
async function applyCmdrPrints(){const want=[];for(const d of S.index){const dk=S.decks[d.slug];if(!dk)continue;let p=dk.cmdrPrint;if(!p&&dk.prints){for(const n of commanderNames(d))if(dk.prints[n]){p=dk.prints[n];break}}if(p)want.push([d,p])}
  if(!want.length)return;const ids=[...new Set(want.map(x=>x[1]))];const got=new Map();
  try{for(let i=0;i<ids.length;i+=75){const r=await fetch('https://api.scryfall.com/cards/collection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifiers:ids.slice(i,i+75).map(p=>({set:p.split('/')[0],collector_number:p.split('/')[1]}))})});if(r.ok){const j=await r.json();for(const c of (j.data||[]).map(slim))got.set(c.setcode+'/'+String(c.cn).toLowerCase(),c)}}}catch(e){return}
  for(const [d,p] of want){const c=got.get(p);if(c&&c.artc){d.art=c.artc;d.img=c.imgN||d.img}}renderHome()}
async function resolveCommanders(){ // colors + art from Scryfall, one batched call, cached per browser
  let cache=null;try{cache=JSON.parse(localStorage.getItem('cmdrs')||'null')}catch(e){}
  const need=S.index.filter(d=>!d.ci||!d.ci.length||!d.art);
  if(cache&&cache.date===S.snap.date){for(const d of need){const c=cache.m[d.name];if(c){d.ci=c.ci;d.art=c.art;d.img=c.img;if(c.realName)d.realName=c.realName;S.cmdr[d.slug]=c}}}
  const still=need.filter(d=>!d.ci||!d.ci.length||!d.art);if(!still.length){renderHome();return}
  try{const cards=await cardsNamed(still.map(d=>d.name));const m=(cache&&cache.date===S.snap.date)?cache.m:{};
    // Scryfall's batch endpoint misses some cards (e.g. certain Secret Lair prints); look those up one by one
    const got=new Set(cards.map(c=>norm(c.name)));
    for(const d of still.filter(x=>!got.has(norm(x.name)))){const c=await commanderCard(d);if(c){c._for=d.slug;cards.push(c)}await sleep(120)}
    for(const c of cards){const d=c._for?still.find(x=>x.slug===c._for):still.find(x=>norm(x.name)===norm(c.name));if(!d)continue;if(norm(c.name)!==norm(d.name))d.realName=c.name;c.art=c.img.replace('/small/','/art_crop/');d.ci=c.ci;d.art=c.art;d.img=c.img.replace('/small/','/normal/');S.cmdr[d.slug]=c;m[d.name]={ci:c.ci,art:c.art,img:d.img,oracle:c.oracle,type:c.type,realName:d.realName||null}}
    try{localStorage.setItem('cmdrs',JSON.stringify({date:S.snap.date,m}))}catch(e){}
  }catch(e){console.warn('commander lookup',e)}
  renderHome();
}
(async()=>{wire();try{await loadSnapshot()}catch(e){$('#status').innerHTML='<span>Snapshot failed to load.</span>';return}
  renderHome();await Promise.all([initDb().then(()=>syncTok()&&Promise.race([syncNow(),new Promise(r=>setTimeout(r,10000))])),resolveCommanders()]);renderHome();syncStatus(S.syncMsg||'',S.syncErr);applyCmdrPrints();refreshPrices();if(location.hash==='#playtest')openPlaytest();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&syncTok())syncNow()});
  window.addEventListener('hashchange',()=>{if(location.hash==='#playtest'&&$('#play').hidden)openPlaytest();else if(location.hash!=='#playtest'&&!$('#play').hidden){if(PT.table){PT.table.aborted=true;PT.table=null}showView('home');renderHome()}});})();
})();
